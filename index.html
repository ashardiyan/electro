<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Al Rehman Electronics Inventory</title>
  <meta name="theme-color" content="#3B82F6" />
  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Restored User Icon URL for PWA and favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="https://github.com/ashardiyan/test/blob/main/Al%20Rahman%20Electronics-02.png?raw=true" onerror="this.onerror=null;this.href='https://placehold.co/192x192/0C1220/ffffff?text=ARE'">
  <link rel="apple-touch-icon" type="image/png" sizes="192x192" href="https://github.com/ashardiyan/test/blob/main/Al%20Rahman%20Electronics-02.png?raw=true" onerror="this.onerror=null;this.href='https://placehold.co/192x192/0C1220/ffffff?text=ARE'">

  <!-- PWA Manifest (Embedded via Data URL) for Chrome Installation -->
  <script>
    const manifestContent = JSON.stringify({
        name: "Al Rehman Electronics",
        short_name: "ARE Inventory",
        description: "Al Rehman Electronics Inventory Management App",
        start_url: "./index.html",
        display: "standalone",
        background_color: "#0C1220",
        theme_color: "#3B82F6",
        icons: [
            {
                src: "https://github.com/ashardiyan/test/blob/main/Al%20Rahman%20Electronics-02.png?raw=true",
                sizes: "192x192",
                type: "image/png"
            },
            {
                src: "https://github.com/ashardiyan/test/blob/main/Al%20Rahman%20Electronics-02.png?raw=true",
                sizes: "512x512",
                type: "image/png"
            }
        ]
    });
    const manifestDataUrl = `data:application/json;base64,${btoa(manifestContent)}`;
  </script>
  <link rel="manifest" id="pwa-manifest" href="" />
  <script>
    // Set the manifest href using the generated data URL
    document.getElementById('pwa-manifest').href = manifestDataUrl;
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    /* Custom style overrides and initialization */
    :root {
      --primary-color: #3B82F6; /* blue-500 */
      --bg-dark: #0C1220; /* Deep Blue/Black */
      --bg-light: #1E293B; /* slate-800 */
      --text-light: #F8FAFC; /* slate-50 */
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
    }

    /* Scrollbar for dark theme */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-light);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--primary-color);
      border-radius: 4px;
    }

    /* Modal Fade In */
    .modal-enter {
      opacity: 0;
      transform: scale(0.95);
    }
    .modal-enter-active {
      opacity: 1;
      transform: scale(1);
      transition: opacity 150ms ease-out, transform 150ms ease-out;
    }
    .modal-exit {
      opacity: 1;
      transform: scale(1);
    }
    .modal-exit-active {
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 150ms ease-in, transform 150ms ease-in;
    }

    /* PWA Status */
    #pwa-status {
      transition: opacity 0.3s ease;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'bg-dark': '#0C1220',
            'bg-light': '#1E293B',
            'primary': '#3B82F6',
            'text-light': '#F8FAFC',
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen">

  <!-- PWA Status Indicator -->
  <div id="pwa-status" class="fixed top-0 right-0 m-4 p-2 text-xs font-semibold rounded-full shadow-lg z-50 transition-colors"
       style="background-color: #10B981; color: white;">
      ONLINE
  </div>

  <!-- Main Application Container -->
  <!-- Initially hidden, will show after successful local login -->
  <div id="app" class="p-4 md:p-8 max-w-7xl mx-auto hidden">
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center pb-6 border-b border-slate-700 mb-6">
      <h1 class="text-4xl font-black text-primary mb-2 md:mb-0">Al Rehman Electronics</h1>
      <div class="text-sm">
        <span class="text-slate-400">Status:</span>
        <span id="user-id-display" class="font-mono text-text-light text-xs bg-bg-light p-1 rounded-md cursor-help" title="Data is stored locally in your browser">
          Local Storage
        </span>
        <button onclick="logout()" class="ml-4 bg-red-600 hover:bg-red-700 text-white font-semibold py-1 px-3 rounded-lg transition duration-150">
            Logout
        </button>
      </div>
    </header>

    <!-- Product List Section -->
    <main class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <div class="lg:col-span-2">
        <div class="flex flex-col md:flex-row justify-between items-center mb-4">
          <h2 class="text-2xl font-bold text-text-light mb-4 md:mb-0">Product Inventory</h2>
          <div id="multi-select-controls" class="space-x-2 flex hidden">
            <button onclick="deleteSelectedProducts()" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-xl shadow-lg transition duration-150 flex items-center">
              <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              Delete Selected (<span id="selected-count">0</span>)
            </button>
            <button onclick="clearSelection()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 px-4 rounded-xl shadow-lg transition duration-150">
              Clear Selection
            </button>
          </div>
        </div>

        <!-- Product Table -->
        <div class="bg-bg-light rounded-2xl shadow-2xl overflow-hidden">
          <table class="min-w-full divide-y divide-slate-700">
            <thead class="bg-slate-700">
              <tr>
                <th class="w-10 px-4 py-3 text-left text-xs font-bold text-slate-300 uppercase tracking-wider"></th>
                <th class="px-6 py-3 text-left text-xs font-bold text-slate-300 uppercase tracking-wider">Product Name</th>
                <th class="px-6 py-3 text-left text-xs font-bold text-slate-300 uppercase tracking-wider">Qty</th>
                <th class="px-6 py-3 text-left text-xs font-bold text-slate-300 uppercase tracking-wider">Price (PKR)</th>
                <th class="px-6 py-3 text-right text-xs font-bold text-slate-300 uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody id="product-list" class="divide-y divide-slate-800">
              <!-- Products will be injected here -->
            </tbody>
          </table>
          <div id="empty-list-message" class="p-6 text-center text-slate-400 italic hidden">
            No products found. Add a new product to get started!
          </div>
        </div>

        <!-- Utility Controls: Export/Import -->
        <div class="mt-6 flex flex-wrap gap-4 justify-start">
            <button onclick="exportProducts()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-xl shadow-lg transition duration-150 flex items-center">
                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Export JSON
            </button>
            <label for="import-file" class="cursor-pointer bg-orange-600 hover:bg-orange-700 text-white font-semibold py-2 px-4 rounded-xl shadow-lg transition duration-150 flex items-center">
                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Import JSON
            </label>
            <input type="file" id="import-file" accept="application/json" onchange="importProducts(event.target.files[0])" class="hidden">
        </div>

      </div>

      <!-- Add/Edit Form Section -->
      <div class="lg:col-span-1 bg-bg-light p-6 rounded-2xl shadow-2xl h-fit sticky top-8">
        <h2 id="form-title" class="text-2xl font-bold text-primary mb-6">Add New Product</h2>
        <form id="product-form">
          <input type="hidden" id="product-id" value="">

          <div class="mb-4">
            <label for="product-name" class="block text-sm font-medium text-slate-300 mb-1">Product Name</label>
            <input type="text" id="product-name" required class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 text-text-light focus:outline-none focus:ring-2 focus:ring-primary" placeholder="e.g., LED TV 42 inch">
          </div>

          <div class="mb-4">
            <label for="product-qty" class="block text-sm font-medium text-slate-300 mb-1">Quantity</label>
            <input type="number" id="product-qty" required min="1" class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 text-text-light focus:outline-none focus:ring-2 focus:ring-primary" placeholder="e.g., 50">
          </div>

          <div class="mb-6">
            <label for="product-price" class="block text-sm font-medium text-slate-300 mb-1">Price (PKR)</label>
            <input type="number" id="product-price" required min="0" step="0.01" class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 text-text-light focus:outline-none focus:ring-2 focus:ring-primary" placeholder="e.g., 55000.00">
          </div>

          <button type="submit" id="form-submit-btn" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-150">
            Add Product
          </button>
          <button type="button" onclick="cancelEdit()" id="form-cancel-btn" class="w-full mt-2 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 px-4 rounded-xl transition duration-150 hidden">
            Cancel Edit
          </button>
        </form>
      </div>
    </main>
  </div>

  <!-- Login/Auth Screen -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-bg-light p-8 md:p-12 rounded-2xl shadow-2xl max-w-sm w-full border border-slate-700">
      <h2 class="text-3xl font-bold text-center text-primary mb-6">Welcome Back</h2>
      <p class="text-center text-slate-400 mb-8">Sign in to manage your inventory.</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-300 mb-1">Username</label>
          <input type="text" id="username" value="admin" required class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 text-text-light focus:outline-none focus:ring-2 focus:ring-primary">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Password</label>
          <input type="password" id="password" value="123" required class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 text-text-light focus:outline-none focus:ring-2 focus:ring-primary">
        </div>
        <button type="submit" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg transition duration-150">
          Log In
        </button>
      </form>
      <p class="mt-6 text-sm text-slate-500 text-center">
          Username: admin, Password: 123 (Hardcoded)
      </p>
    </div>
  </div>

  <!-- Custom Modal Container -->
  <div id="custom-modal-backdrop" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 transition-opacity duration-300 hidden">
    <div id="custom-modal-content" class="bg-bg-light p-6 rounded-xl shadow-2xl max-w-sm w-full modal-enter border border-primary transition-all duration-300">
      <h3 id="modal-title" class="text-xl font-bold text-primary mb-4"></h3>
      <p id="modal-message" class="text-slate-300 mb-6"></p>
      <div id="modal-actions" class="flex justify-end space-x-3">
        <!-- Actions here -->
      </div>
    </div>
  </div>

  <!-- Local Storage and App Logic -->
  <script>
    // Global App Variables
    let products = [];
    let selectedProductIds = new Set();
    let currentEditingProductId = null;
    
    // UI elements
    const authScreen = document.getElementById('auth-screen');
    const appScreen = document.getElementById('app');

    // --- CUSTOM MODAL FUNCTIONS (Replacing alert/confirm) ---

    const modalBackdrop = document.getElementById('custom-modal-backdrop');
    const modalContent = document.getElementById('custom-modal-content');
    const modalTitle = document.getElementById('modal-title');
    const modalMessage = document.getElementById('modal-message');
    const modalActions = document.getElementById('modal-actions');

    /**
     * Shows a custom modal dialog (alert/confirmation replacement).
     * @param {string} title
     * @param {string} message
     * @param {boolean} isConfirm - If true, shows OK and Cancel. If false, shows only OK.
     * @returns {Promise<boolean>} Resolves true for OK, false/rejects for Cancel/close.
     */
    function showModal(title, message, isConfirm = false) {
        modalTitle.textContent = title;
        modalMessage.textContent = message;
        modalActions.innerHTML = ''; // Clear previous actions

        modalContent.classList.remove('modal-exit-active', 'modal-exit');
        modalContent.classList.add('modal-enter');
        modalBackdrop.classList.remove('hidden');

        return new Promise(resolve => {
            const okButton = document.createElement('button');
            okButton.textContent = isConfirm ? 'Confirm' : 'OK';
            okButton.className = 'bg-primary hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-150';
            okButton.onclick = () => {
                modalBackdrop.classList.add('hidden');
                resolve(true);
            };
            modalActions.appendChild(okButton);

            if (isConfirm) {
                const cancelButton = document.createElement('button');
                cancelButton.textContent = 'Cancel';
                cancelButton.className = 'bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-150';
                cancelButton.onclick = () => {
                    modalBackdrop.classList.add('hidden');
                    resolve(false);
                };
                modalActions.prepend(cancelButton); // Prepend so Cancel is on the left
            }
        });
    }

    // --- LOCAL STORAGE DATA OPERATIONS ---

    function saveProducts() {
        // Save the current state of products to local storage
        localStorage.setItem('dealer-products', JSON.stringify(products));
    }

    function loadProducts() {
        // Load products from local storage and assign a unique ID if missing
        const storedProducts = localStorage.getItem('dealer-products');
        if (storedProducts) {
            try {
                products = JSON.parse(storedProducts).map(p => ({
                    // Ensure every product has a unique ID, generating one if imported data lacks it
                    id: p.id || crypto.randomUUID(),
                    ...p
                }));
            } catch (e) {
                console.error("Error parsing local storage data:", e);
                products = [];
            }
        } else {
            products = [];
        }
        // Initial sorting by name
        products.sort((a, b) => a.name.localeCompare(b.name));
        refreshProductList();
    }

    // --- AUTHENTICATION LOGIC (Local Storage based) ---

    function checkLoginStatus() {
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        if (isLoggedIn) {
            appScreen.classList.remove('hidden');
            authScreen.classList.add('hidden');
            loadProducts(); // Load data only after login success
        } else {
            appScreen.classList.add('hidden');
            authScreen.classList.remove('hidden');
        }
    }

    document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Hardcoded Credentials Check
        if (username === 'admin' && password === '123') {
            localStorage.setItem('isLoggedIn', 'true');
            await showModal('Login Success', 'Redirecting to inventory dashboard...');
            checkLoginStatus(); // Change UI state
        } else {
            await showModal('Login Failed', 'Invalid username or password.', false);
        }
    });

    window.logout = async function() {
        const confirmed = await showModal('Confirm Logout', 'Are you sure you want to log out?', true);
        if (confirmed) {
            localStorage.removeItem('isLoggedIn');
            products = []; // Clear current products from memory
            checkLoginStatus(); // Change UI state
            await showModal('Logged Out', 'You have been successfully logged out.');
        }
    }

    // --- PRODUCT CRUD FUNCTIONS ---

    document.getElementById('product-form').addEventListener('submit', handleProductSubmit);

    async function handleProductSubmit(event) {
        event.preventDefault();
        const name = document.getElementById('product-name').value.trim();
        const qty = parseInt(document.getElementById('product-qty').value, 10);
        const price = parseFloat(document.getElementById('product-price').value);
        const productId = document.getElementById('product-id').value;

        const productData = {
            name: name,
            qty: qty,
            price: price,
            // Use local UUID for unique ID generation
            id: productId || crypto.randomUUID(),
            updatedAt: Date.now()
        };

        let message = '';
        if (productId) {
            // Edit existing product
            const index = products.findIndex(p => p.id === productId);
            if (index !== -1) {
                products[index] = productData;
                message = `${name} updated successfully!`;
            }
        } else {
            // Add new product
            products.push(productData);
            message = `${name} added successfully!`;
        }

        saveProducts();
        products.sort((a, b) => a.name.localeCompare(b.name)); // Re-sort
        refreshProductList();

        await showModal('Success', message);
        document.getElementById('product-form').reset();
        cancelEdit();
    }

    function refreshProductList() {
        const listElement = document.getElementById('product-list');
        listElement.innerHTML = '';
        document.getElementById('empty-list-message').classList.toggle('hidden', products.length > 0);

        products.forEach(product => {
            const isSelected = selectedProductIds.has(product.id);
            const row = document.createElement('tr');
            row.className = `border-b border-slate-800 hover:bg-slate-700 transition duration-100 ${isSelected ? 'bg-slate-700' : 'bg-bg-light'}`;
            row.innerHTML = `
                <td class="px-4 py-3">
                    <input type="checkbox" data-id="${product.id}" onchange="toggleSelection('${product.id}')" ${isSelected ? 'checked' : ''}
                           class="form-checkbox h-5 w-5 text-primary bg-slate-600 border-slate-500 rounded focus:ring-primary cursor-pointer">
                </td>
                <td class="px-6 py-3 font-semibold text-text-light">${product.name}</td>
                <td class="px-6 py-3 text-slate-300">${product.qty}</td>
                <td class="px-6 py-3 font-mono text-emerald-400">${product.price ? product.price.toFixed(2) : '0.00'}</td>
                <td class="px-6 py-3 text-right whitespace-nowrap space-x-2">
                    <button onclick="editProduct('${product.id}')" class="text-primary hover:text-blue-400 font-medium transition duration-150">Edit</button>
                    <button onclick="deleteProduct('${product.id}')" class="text-red-500 hover:text-red-400 font-medium transition duration-150">Delete</button>
                </td>
            `;
            listElement.appendChild(row);
        });

        updateMultiSelectControls();
    }

    function editProduct(id) {
        const product = products.find(p => p.id === id);
        if (!product) return;

        document.getElementById('product-id').value = id;
        document.getElementById('product-name').value = product.name;
        document.getElementById('product-qty').value = product.qty;
        document.getElementById('product-price').value = product.price;

        document.getElementById('form-title').textContent = `Edit Product: ${product.name}`;
        document.getElementById('form-submit-btn').textContent = 'Update Product';
        document.getElementById('form-cancel-btn').classList.remove('hidden');
        currentEditingProductId = id;
    }

    function cancelEdit() {
        document.getElementById('product-form').reset();
        document.getElementById('product-id').value = '';
        document.getElementById('form-title').textContent = 'Add New Product';
        document.getElementById('form-submit-btn').textContent = 'Add Product';
        document.getElementById('form-cancel-btn').classList.add('hidden');
        currentEditingProductId = null;
    }

    async function deleteProduct(id) {
        const product = products.find(p => p.id === id);
        if (!product) return;

        const confirmed = await showModal('Confirm Deletion', `Are you sure you want to permanently delete product: ${product.name}?`, true);

        if (confirmed) {
            products = products.filter(p => p.id !== id);
            selectedProductIds.delete(id);
            saveProducts();
            refreshProductList();
            await showModal('Success', `${product.name} deleted.`);
        }
    }

    // --- MULTI-SELECT AND BATCH DELETE ---

    window.toggleSelection = function (id) {
        if (selectedProductIds.has(id)) {
            selectedProductIds.delete(id);
        } else {
            selectedProductIds.add(id);
        }
        refreshProductList(); // Re-render to update checkbox status and controls
    }

    window.clearSelection = function () {
        selectedProductIds.clear();
        refreshProductList();
    }

    function updateMultiSelectControls() {
        const count = selectedProductIds.size;
        document.getElementById('selected-count').textContent = count;
        document.getElementById('multi-select-controls').classList.toggle('hidden', count === 0);
    }

    window.deleteSelectedProducts = async function () {
        if (selectedProductIds.size === 0) return;

        const confirmed = await showModal('Confirm Batch Delete', `Are you sure you want to permanently delete ${selectedProductIds.size} selected products?`, true);

        if (confirmed) {
            const initialSize = products.length;
            products = products.filter(p => !selectedProductIds.has(p.id));
            const deletedCount = initialSize - products.length;

            saveProducts();
            selectedProductIds.clear();
            refreshProductList();

            await showModal('Success', `${deletedCount} products deleted successfully.`);
        }
    }

    // --- EXPORT/IMPORT FEATURES ---

    window.exportProducts = function () {
        if (products.length === 0) {
            showModal('Export Failed', 'No products to export.', false);
            return;
        }
        const dataStr = JSON.stringify(products.map(p => ({
            name: p.name,
            qty: p.qty,
            price: p.price
        })), null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'al-rehman-electronics-inventory.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    };

    window.importProducts = async function (file) {
        if (!file) return;

        try {
            // Helper to read file as text
            const text = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsText(file);
            });

            let arr = JSON.parse(text);
            if (!Array.isArray(arr)) throw new Error('Invalid file - data not array');

            // Validate and clean up imported data
            arr = arr.filter(prod => prod && typeof prod === 'object' && 'name' in prod && 'qty' in prod && 'price' in prod);
            if (!arr.length) throw new Error('No valid products in file!');

            const confirmed = await showModal('Confirm Import', `Import will OVERWRITE your current inventory with ${arr.length} product(s). Are you sure?`, true);

            if (!confirmed) return;

            // Assign new IDs to imported products to avoid conflicts
            products = arr.map(p => ({
                id: crypto.randomUUID(),
                ...p
            }));
            
            saveProducts();
            products.sort((a, b) => a.name.localeCompare(b.name));
            refreshProductList();
            selectedProductIds.clear();
            updateMultiSelectControls();
            
            document.getElementById('import-file').value = ''; // Clear file input
            await showModal('Import Successful', 'Your inventory has been replaced with the imported data.');

        } catch (ex) {
            console.error("Import Failed:", ex);
            document.getElementById('import-file').value = '';
            await showModal('Import Failed', "Could not import products: " + (ex.message || ex));
        }
    };

    // --- PWA SERVICE WORKER REGISTRATION ---

    // Define the Service Worker content as a Blob/URL
    const swCode = `
        const CACHE_NAME = 'are-inventory-cache-v1';
        const urlsToCache = [
            './index.html',
            'https://cdn.tailwindcss.com',
            'https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap',
        ];

        self.addEventListener('install', event => {
            console.log('Service Worker: Installing...');
            event.waitUntil(
                caches.open(CACHE_NAME)
                    .then(cache => {
                        return cache.addAll(urlsToCache);
                    })
            );
        });

        self.addEventListener('fetch', event => {
            event.respondWith(
                caches.match(event.request)
                    .then(response => {
                        if (response) {
                            return response;
                        }
                        return fetch(event.request);
                    })
                    .catch(() => {
                        return caches.match('./index.html');
                    })
            );
        });

        self.addEventListener('activate', event => {
            console.log('Service Worker: Activating...');
            event.waitUntil(
                caches.keys().then(cacheNames => {
                    return Promise.all(
                        cacheNames.filter(name => name !== CACHE_NAME)
                                  .map(name => caches.delete(name))
                    );
                })
            );
        });
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(swBlob);

    function registerServiceWorker() {
        const statusElement = document.getElementById('pwa-status');
        
        function updatePWAStatus(isOnline) {
            if (isOnline) {
                statusElement.textContent = 'ONLINE';
                statusElement.style.backgroundColor = '#10B981'; // green-500
            } else {
                statusElement.textContent = 'OFFLINE (Cached)';
                statusElement.style.backgroundColor = '#F59E0B'; // amber-500
            }
        }
        
        updatePWAStatus(navigator.onLine);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register(swUrl, { scope: './' })
                    .then(reg => {
                        console.log('Service Worker Registered. Scope is ' + reg.scope);
                        window.addEventListener('online', () => updatePWAStatus(true));
                        window.addEventListener('offline', () => updatePWAStatus(false));
                    })
                    .catch(err => console.error('Service Worker registration failed: ', err));
            });
        }
    }

    // --- INITIALIZATION ---

    window.addEventListener('load', function() {
        registerServiceWorker();
        checkLoginStatus(); // Check if user has already logged in
    });

  </script>
</body>
